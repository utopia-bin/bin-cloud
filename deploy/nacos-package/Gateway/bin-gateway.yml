spring:
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 3s

gateway:
  # 生产环境必须通过 JWT_SECRET 注入至少 32 位的随机密钥。
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration: ${JWT_EXPIRATION:7200}
  white-paths: []
  rate-limit-replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
  rate-limit-burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
  rate-limit-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:100}
  rate-limit-enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
  canary-enabled: ${GATEWAY_CANARY_ENABLED:false}
  canary-ratio: ${GATEWAY_CANARY_RATIO:0.1}
  canary-fallback-enabled: ${GATEWAY_CANARY_FALLBACK_ENABLED:false}
  canary-header-enabled: ${GATEWAY_CANARY_HEADER_ENABLED:false}
  token-blacklist-enabled: ${GATEWAY_TOKEN_BLACKLIST_ENABLED:false}
  token-blacklist-fail-closed: ${GATEWAY_TOKEN_BLACKLIST_FAIL_CLOSED:true}
  max-request-size: ${GATEWAY_MAX_REQUEST_SIZE:10485760}
  websocket-token-paths:
    - /ws/**
    - /websocket/**
  allowed-origin-patterns: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  trusted-proxy-addresses:
    - ${GATEWAY_TRUSTED_PROXY_1:127.0.0.1}
    - ${GATEWAY_TRUSTED_PROXY_2:0:0:0:0:0:0:0:1}
    - ${GATEWAY_TRUSTED_PROXY_3:172.17.0.1}
  context:
    signing-secret: ${GATEWAY_CONTEXT_SIGNING_SECRET:${JWT_SECRET:}}
    signature-max-age: ${GATEWAY_CONTEXT_SIGNATURE_MAX_AGE:30s}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      adminApiCB:
        base-config: default
      openApiCB:
        base-config: default
      platformApiCB:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true
    instances:
      adminApiCB:
        base-config: default
      openApiCB:
        base-config: default
      platformApiCB:
        base-config: default
