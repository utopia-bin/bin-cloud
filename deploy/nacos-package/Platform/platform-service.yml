spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:host.docker.internal}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bin_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      connection-timeout: 30000
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 3s
  cache:
    type: redis
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-value: 1
      logic-not-delete-value: 0

gateway:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration: ${JWT_EXPIRATION:7200}
  context:
    signing-secret: ${GATEWAY_CONTEXT_SIGNING_SECRET:${JWT_SECRET:}}
    signature-max-age: ${GATEWAY_CONTEXT_SIGNATURE_MAX_AGE:30s}

platform:
  tenant:
    enabled: ${TENANT_ENABLED:true}
    ignore-tables:
      - sys_tenant
      - sys_menu
      - sys_permission
      - sys_operate_log
  login-security:
    max-fail-count: ${LOGIN_MAX_FAIL_COUNT:5}
    lock-duration-seconds: ${LOGIN_LOCK_DURATION_SECONDS:900}
    fail-count-window-seconds: ${LOGIN_FAIL_COUNT_WINDOW_SECONDS:1800}
    delay-base-ms: ${LOGIN_DELAY_BASE_MS:200}
    max-delay-ms: ${LOGIN_MAX_DELAY_MS:3000}
    password-min-length: ${LOGIN_PASSWORD_MIN_LENGTH:8}
    password-require-special: ${LOGIN_PASSWORD_REQUIRE_SPECIAL:false}
  sms:
    default-provider: ${SMS_DEFAULT_PROVIDER:}
    code-ttl: ${SMS_CODE_TTL:5m}
    send-interval: ${SMS_SEND_INTERVAL:60s}
    max-verify-attempts: ${SMS_MAX_VERIFY_ATTEMPTS:5}
    templates:
      REGISTER: ${SMS_TEMPLATE_REGISTER:}
      LOGIN: ${SMS_TEMPLATE_LOGIN:}
      RESET_PASSWORD: ${SMS_TEMPLATE_RESET_PASSWORD:}

logging:
  level:
    cn.utopiabin.cloud: ${APP_LOG_LEVEL:INFO}
