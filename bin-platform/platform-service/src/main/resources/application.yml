server:
  port: 8300

spring:
  application:
    name: platform-service

  # 引入 Nacos 动态配置
  config:
    import:
      - optional:nacos:platform-service.yml
      - optional:nacos:platform-service-dubbo.yml

  # Nacos 服务发现 + 配置中心
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.220.128:8848
        namespace: ${NACOS_NAMESPACE:bin-cloud}
        group: Platform
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:Beyond129814.}
      config:
        server-addr: 192.168.220.128:8848
        namespace: ${NACOS_NAMESPACE:bin-cloud}
        group: Platform
        file-extension: yml
        refresh-enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:Beyond129814.}

  # 数据源 (MyBatis-Plus + HikariCP)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.220.128}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bin_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: PlatformHikariPool

  # Redis (限流缓存 + 分布式锁 Redisson)
  data:
    redis:
      host: ${REDIS_HOST:192.168.220.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Redis_2026#x9K3mP}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Dubbo (提供者)
dubbo:
  application:
    name: platform-service
  registry:
    address: nacos://${NACOS_SERVER_ADDR:192.168.220.128:8848}
    parameters:
      namespace: ${NACOS_NAMESPACE:bin-cloud}
      group: Dubbo
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:Beyond129814.}
  protocol:
    name: dubbo
    port: ${DUBBO_PROTOCOL_PORT:20880}
  scan:
    base-packages: cn.utopiabin.cloud.platform.api.impl
  provider:
    timeout: 5000
    retries: 0

# 网关共用 JWT 配置 (与 bin-gateway 一致)
gateway:
  jwt-secret: ${JWT_SECRET:OTodCmc76iL29Vzveq+liHX99hIV3DK0JUp7WPae7tMt5Z5Co/V1yAtqnb8L6uinpD1RutyezEm8YPXlCVKTMw==}
  jwt-expiration: ${JWT_EXPIRATION:7200}
  token-blacklist-enabled: false
