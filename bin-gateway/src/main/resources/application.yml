server:
  port: 8000
spring:
  application:
    name: bin-gateway
  config:
    import:
      - optional:nacos:bin-gateway.yml
      - optional:nacos:bin-gateway-routes.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:bin-cloud}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:bin-cloud}
        group: Gateway
        file-extension: yml
        refresh-enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}

gateway:
  jwt-secret: ${JWT_SECRET:}
  allowed-origin-patterns: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  context:
    signing-secret: ${GATEWAY_CONTEXT_SIGNING_SECRET:${JWT_SECRET:}}
    signature-max-age: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
