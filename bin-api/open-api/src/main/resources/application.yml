server:
  port: 8200

spring:
  application:
    name: open-api

  # 引入 Nacos 动态配置
  config:
    import:
      - optional:nacos:open-api.yml
      - optional:nacos:open-api-dubbo.yml

  # Nacos 服务发现 + 配置中心
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:bin-cloud}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:bin-cloud}
        group: Api
        file-extension: yml
        refresh-enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}

# Dubbo (消费端)
dubbo:
  application:
    name: open-api
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
    parameters:
      namespace: ${NACOS_NAMESPACE:bin-cloud}
      group: Dubbo
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
  consumer:
    check: false
    timeout: 5000
    retries: 0

# 仅接受网关签名后的用户身份头。该密钥必须与 bin-gateway 一致。
gateway:
  context:
    signing-secret: ${GATEWAY_CONTEXT_SIGNING_SECRET:${JWT_SECRET:}}
    signature-max-age: 30s
